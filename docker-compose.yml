version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_dbstock
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: suasenha
      POSTGRES_DB: dbstock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: